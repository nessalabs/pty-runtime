name: Runtime gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - uses: actions/cache@v4
        with:
          path: work/experiment-cache
          key: native-baseline-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('experiments/dependencies.json', 'experiments/run.py', 'scripts/native/bootstrap.py', 'scripts/native/verify_source.py', 'scripts/native/patches/snapshot-pending-wrap.patch') }}
      - run: python3 scripts/gate.py
  msrv:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: '1.85.0'
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: python3 scripts/native/bootstrap.py
      - run: cargo test --locked --workspace --all-targets --all-features
