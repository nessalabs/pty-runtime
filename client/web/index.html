<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PTY runtime terminal</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        background: #0b0b0f;
        color: #cfcfd6;
        font: 14px ui-sans-serif, system-ui, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 10px 14px;
        border-bottom: 1px solid #23232c;
        display: flex;
        gap: 12px;
        align-items: baseline;
      }
      header strong { font-weight: 600; }
      header span { color: #7a7a88; }
      #root { flex: 1; min-height: 0; padding: 8px; }
    </style>
  </head>
  <body>
    <header>
      <strong>PTY runtime</strong>
      <span>rendered by the runtime, not the browser &mdash; click to focus</span>
    </header>
    <div id="root"></div>

    <script type="module">
      import React from "https://esm.sh/react@18.3.1";
      import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";
      import { Terminal } from "./terminal.js";

      const url = `ws://${location.host}/ws`;
      createRoot(document.getElementById("root")).render(
        React.createElement(Terminal, { url }),
      );
    </script>
  </body>
</html>
