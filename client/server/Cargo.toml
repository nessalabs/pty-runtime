[package]
name = "pty-runtime-client-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
pty-runtime = { path = "../.." }
pty-runtime-infrastructure = { path = "../../crates/infrastructure", features = ["ghostty"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs"] }

[workspace]
